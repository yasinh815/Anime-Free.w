<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Anime Hub - Watch Anime Series</title>
                <style>
                        body {
                                        background-color: #0d0d0d;
                                                    color: #ffffff;
                                                                font-family: Arial, sans-serif;
                                                                            margin: 0;
                                                                                        padding: 0;
                        }
                                header {
                                                background-color: #161616;
                                                            padding: 20px;
                                                                        text-align: center;
                                                                                    font-size: 24px;
                                                                                                font-weight: bold;
                                                                                                            color: #ff0055;
                                                                                                                        border-bottom: 2px solid #222;
                                }
                                        .section-title {
                                                        margin: 20px 15px 10px;
                                                                    font-size: 20px;
                                                                                color: #fff;
                                                                                            border-left: 4px solid #ff0055;
                                                                                                        padding-left: 10px;
                                        }
                                                .grid-container {
                                                                display: flex;
                                                                            gap: 15px;
                                                                                        overflow-x: auto;
                                                                                                    padding: 10px 15px;
                                                                                                                scroll-behavior: smooth;
                                                }
                                                        .grid-container::-webkit-scrollbar {
                                                                        height: 6px;
                                                        }
                                                                .grid-container::-webkit-scrollbar-thumb {
                                                                                background: #333;
                                                                                            border-radius: 10px;
                                                                }
                                                                        .card {
                                                                                        min-width: 150px;
                                                                                                    width: 150px;
                                                                                                                background: #1a1a1a;
                                                                                                                            border-radius: 10px;
                                                                                                                                        overflow: hidden;
                                                                                                                                                    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
                                                                                                                                                                flex-shrink: 0;
                                                                                                                                                                            cursor: pointer;
                                                                                                                                                                                        transition: transform 0.2s;
                                                                        }
                                                                                .card:hover {
                                                                                                transform: scale(1.05);
                                                                                }
                                                                                        .card-img {
                                                                                                        position: relative;
                                                                                                                    height: 200px;
                                                                                                                                background-color: #333;
                                                                                        }
                                                                                                .card-img img {
                                                                                                                width: 100%;
                                                                                                                            height: 100%;
                                                                                                                                        object-fit: cover;
                                                                                                }
                                                                                                        .badge {
                                                                                                                        position: absolute;
                                                                                                                                    top: 8px;
                                                                                                                                                left: 8px;
                                                                                                                                                            background: rgba(0, 0, 0, 0.7);
                                                                                                                                                                        color: #fff;
                                                                                                                                                                                    font-size: 11px;
                                                                                                                                                                                                padding: 3px 8px;
                                                                                                                                                                                                            border-radius: 4px;
                                                                                                        }
                                                                                                                .ep-badge {
                                                                                                                                position: absolute;
                                                                                                                                            bottom: 8px;
                                                                                                                                                        left: 8px;
                                                                                                                                                                    background: rgba(255, 0, 85, 0.8);
                                                                                                                                                                                color: #fff;
                                                                                                                                                                                            font-size: 11px;
                                                                                                                                                                                                        padding: 2px 6px;
                                                                                                                                                                                                                    border-radius: 4px;
                                                                                                                }
                                                                                                                        .card-title {
                                                                                                                                        padding: 10px;
                                                                                                                                                    font-size: 13px;
                                                                                                                                                                text-align: center;
                                                                                                                                                                            white-space: nowrap;
                                                                                                                                                                                        overflow: hidden;
                                                                                                                                                                                                    text-overflow: ellipsis;
                                                                                                                        }
                                                                                                                                footer {
                                                                                                                                                margin-top: 40px;
                                                                                                                                                            padding: 20px;
                                                                                                                                                                        background-color: #161616;
                                                                                                                                                                                    text-align: center;
                                                                                                                                                                                                color: #666;
                                                                                                                                                                                                            font-size: 13px;
                                                                                                                                }
                                                                                                                                    </style>
                                                                                                                                    </head>

                                                                                                                                                ANIME HUB
